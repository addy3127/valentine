<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Chotu Baby 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin:0;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;   /* allow vertical scroll */
  overflow-y:auto;
}

/* 🔐 LOCK SCREEN */
#lockScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#e9d5ff,#f5edff);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:1000;
}

#lockScreen input {
  padding:10px;
  border-radius:20px;
  border:none;
  margin-top:10px;
  text-align:center;
}

#lockScreen button {
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#a855f7;
  color:white;
  cursor:pointer;
}

/* 🌫️ BLURRED BACKGROUND */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background:#a855f7;
  background-size: cover;
  filter: blur(18px) brightness(0.6);
  transform: scale(1.1);
  z-index: -1;
}



/* 🌸 MAIN CONTENT */
#main {
  display:none;
  color:white;
  text-align:center;
  padding:40px 20px;
  max-width:900px;
  margin:auto;
}

section {
  padding:20px 20px;
  min-height:10vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

@media (max-width:768px){
  section {
    min-height:auto;
    padding:60px 20px;
  }
}

h1 {
  font-size:38px;
  font-weight:600;
}

.typing {
  border-right:3px solid white;
  overflow:hidden;
  display:inline-block;
  max-width:90%;
  word-wrap:break-word;
}


@keyframes blink {
  50%{border-color:transparent;}
}

.reveal {
  opacity:0;
  transform:translateY(20px);
  transition:1.5s;
}

.reveal.show {
  opacity:1;
  transform:translateY(0);
}

button {
  background:#c084fc;
  border:none;
  padding:12px 25px;
  border-radius:30px;
  color:white;
  cursor:pointer;
  margin:10px;
}

.counter {
  font-size:22px;
  margin-top:20px;
}

.modal {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

.modal.active {
  opacity:1;
  pointer-events:auto;
}

.modal-content {
  margin: 10px;
  background:white;
  color:#6b21a8;
  padding:30px;
  border-radius:20px;
  max-width:400px;
}

.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  width:100%;
  max-width:900px;
  margin-top:30px;
}

.photo-card {
  background:white;
  padding:15px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  transition:0.4s;
}

.photo-card img {
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:15px;
}

.photo-card p {
  color:#6b21a8;
  margin-top:10px;
  font-size:14px;
}

.photo-card:hover {
  transform:translateY(-8px) scale(1.03);
}


@media (max-width:768px){
  h1 {
    font-size:26px;
  }
  h2 {
    font-size:20px;
  }
  .counter {
    font-size:18px;
  }
  button {
    padding:10px 18px;
    font-size:14px;
  }

  button {
    width:90%;
    max-width:280px;
  }
}
</style>
</head>

<body>

<div id="lockScreen">
  <h2>Hi Chotu Baby 💜</h2>
  <p>Enter our special date</p>
  <input type="password" id="password" placeholder="DDMMYY">
  <button onclick="unlock()">Unlock</button>
</div>

<div id="bg"></div>

<div id="main">

<section>
  <h1 class="typing" id="typingText"></h1>
  <h2 class="reveal" id="nameReveal">Chotu Baby 💜</h2>
</section>

<section>
  <div class="counter" id="counter"></div>
</section>

<section>
  <h2>Open When 💌</h2>
  <button onclick="openLetter('sad')">When you're sad</button>
  <button onclick="openLetter('overthink')">When you overthink</button>
  <button onclick="openLetter('miss')">When you miss me</button>
</section>

<section>
  <button onclick="final()">One Last Thing 💜</button>
  <h2 id="finalMessage"></h2>
</section>

<section>
  <h2>Our Little Memories 📸</h2>

  <div class="gallery">
    <div class="photo-card">
      <img src="ruchi.jpeg" alt="memory1">
      <p>That day you smiled and I knew 💜</p>
    </div>

    <div class="photo-card">
      <img src="ruchi1.jpeg" alt="memory2">
      <p>My favorite place is next to you</p>
    </div>

    <div class="photo-card">
      <img src="ruchi2.jpeg" alt="memory3">
      <p>My peace has your face.</p>
    </div>
  </div>
</section>

</div>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>

/* 🔐 PASSWORD */
function unlock(){
  const pass=document.getElementById("password").value;
  if(pass==="031024"){   // change password here
    document.getElementById("lockScreen").style.display="none";
    document.getElementById("main").style.display="block";
    startTyping();
  } else {
    alert("Wrong password, Chotu Baby 💜");
  }
}

/* ⌨️ TYPING EFFECT */
const text="Hi Chotu Baby... Since 3rd October 2024, my life changed.";
let i=0;
function startTyping(){
  const el=document.getElementById("typingText");
  const interval=setInterval(()=>{
    el.innerHTML+=text.charAt(i);
    i++;
    if(i>=text.length){
      clearInterval(interval);
      setTimeout(()=>document.getElementById("nameReveal").classList.add("show"),800);
    }
  },60);
}

/* ⏳ COUNTER */
function updateCounter(){
  const start=new Date("2024-10-03");
  const now=new Date();
  const diff=now-start;
  const days=Math.floor(diff/(1000*60*60*24));
  const hours=Math.floor((diff/(1000*60*60))%24);
  document.getElementById("counter").innerText=
  days+" days "+hours+" hours together 💜";
}
setInterval(updateCounter,1000);

/* 💌 LETTER MODAL */
function openLetter(type){
  const modal=document.getElementById("modal");
  const content=document.getElementById("modalContent");

  if(type==="sad"){
    content.innerHTML="Jaanu... your heart is too soft for heavy days. I’ll always protect your peace.";
  }
  if(type==="overthink"){
    content.innerHTML="When your mind gets loud, remember — I choose you. Every time.";
  }
  if(type==="miss"){
    content.innerHTML="Close your eyes. Imagine me holding your hand. That warmth? That’s us.";
  }

  modal.classList.add("active");
  modal.onclick=()=>modal.classList.remove("active");
}

/* 🎉 CONFETTI */
function final(){
  document.getElementById("finalMessage").innerText=
  "Will you be my Valentine? Not just today… but forever? 💜";

  confetti({particleCount:200,spread:120});
}

</script>

</body>
</html>
